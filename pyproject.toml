[project]
name = "nasa-space-app-jukebok"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lucas", email = "lucas.danna@pm.me" },
    { name = "Léo", email = "leo.azais@laposte.net" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "owslib>=0.36.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "pygame>=2.6.1",
    "sounddevice>=0.5.6",
]

[project.scripts]
nasa-space-app-jukebok = "nasa_space_app_jukebok:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
